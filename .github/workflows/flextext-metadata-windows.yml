#
# FlexText Metadata (for lameta): Windows x64 build, artifacts only.
#
# Cost: this fork is PUBLIC and this job uses the standard `windows-latest` runner, so it is free
# (CLAUDE.md, "GitHub costs"). No schedule, no secrets, no releases, no non-standard runners.
# `--publish never`; artifacts are kept 14 days.
#
# Upstream's inherited .github/workflows/main.yml ("Build/release") publishes GitHub Releases on
# pushes to V2/beta/release/V3: never push those names here, and disable it the moment Actions
# are enabled on the fork (`gh workflow disable "Build/release" -R rulingAnts/lameta`).
#
# A workflow file present only on this branch runs on `push` to it; `workflow_dispatch` needs the
# file on the default branch too (PLAN.md decision log, 2026-10-09).

name: FlexText Metadata (Windows x64)

on:
  push:
    branches: [flextext-metadata]
    paths:
      - "src/**"
      - "helper/**"
      - "scripts/flextext/**"
      - "electron-builder.flextext.json5"
      - "electron-builder.json5"
      - "package.json"
      - "yarn.lock"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "locale/**"
      - "archive-configurations/**"
      - ".github/workflows/flextext-metadata-windows.yml"
  pull_request:
    branches: [flextext-metadata]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flextext-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (windows-latest, x64)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch upstream V3 (for the footprint check)
        run: |
          git remote add upstream https://github.com/onset/lameta.git
          git fetch --no-tags upstream V3

      - name: Node and Yarn as pinned in package.json (Volta)
        uses: volta-cli/action@5c175f92dea6f48441c436471e6479dbc192e194 # v4.2.1

      - name: Python 3.12 x64
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: rclone (pinned, SHA256-verified)
        run: scripts/flextext/fetch-rclone.sh windows-amd64

      - name: Helper: install and test (fake flexicon, real rclone on loopback)
        env:
          FLEXTEXT_RCLONE: ${{ github.workspace }}\helper\third_party\rclone\rclone.exe
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r helper/requirements-dev.txt
          python -m pytest helper/tests -q

      - name: Helper: build with PyInstaller (--onedir)
        run: |
          python -m PyInstaller --noconfirm --distpath helper/dist --workpath helper/build helper/flextext-helper.spec
          ls helper/dist/flextext-helper | head -20
          test -f helper/dist/flextext-helper/flextext-helper.exe

      - name: Helper: smoke-test the frozen exe
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"ping"}' | FLEXTEXT_FLEX_ADAPTER=fake ./helper/dist/flextext-helper/flextext-helper.exe --no-job-object | head -2

      - name: Process cleanup regression test (PLAN §1.9)
        run: |
          node scripts/flextext/process-cleanup-test.js \
            --helper "$(pwd)/helper/dist/flextext-helper/flextext-helper.exe" \
            --rclone "$(pwd)/helper/third_party/rclone/rclone.exe" \
            --timeout-ms 5000

      - name: yarn install
        run: yarn install --frozen-lockfile --network-timeout 1000000

      - name: Typecheck and lint
        run: |
          yarn tsc --noEmit
          yarn eslint src/flextext

      - name: Unit tests (fork)
        run: yarn vitest run src/flextext

      - name: Full build (locale compile, tsc, vite)
        run: yarn fullbuild

      - name: Package (electron-builder, FlexText override, no publish)
        run: scripts/flextext/build-win.sh

      - name: Helper cleanup test against the packaged helper
        run: |
          node scripts/flextext/process-cleanup-test.js \
            --helper "$(pwd)/release/win-unpacked/resources/flextext-helper/flextext-helper.exe" \
            --rclone "$(pwd)/release/win-unpacked/resources/rclone/rclone.exe" \
            --timeout-ms 5000

      - name: Upload installer
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: FlexText-Metadata-windows-x64-setup
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 14
          if-no-files-found: error

      - name: Upload unpacked app (for the Parallels VM test)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: FlexText-Metadata-windows-x64-unpacked
          path: release/win-unpacked
          retention-days: 14
